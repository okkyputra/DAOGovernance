specVersion: 1.0.0
description: DAO Governance subgraph
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Governor
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: Governor
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Proposal
        - Vote
        - Delegate
      abis:
        - name: Governor
          file: ./abis/Governor.json
      eventHandlers:
        - event: ProposalCreated(indexed uint256,indexed address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVoteCast
        - event: ProposalCanceled(indexed uint256)
          handler: handleProposalCanceled
        - event: ProposalQueued(indexed uint256,uint256)
          handler: handleProposalQueued
        - event: ProposalExecuted(indexed uint256)
          handler: handleProposalExecuted
      file: ./src/mapping.ts
