[profile.default]
src = "src"
out = "out"
libs = ["lib"
]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

[profile.ci]
fuzz = { runs = 1000 }

[rpc_endpoints]
mainnet = "${RPC_MAINNET_URL}"
sepolia = "${RPC_SEPOLIA_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[fmt]
line_length = 100
tab_width = 4
